services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2213
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pipeline:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:2213@postgres:5432/olist
      EXTRACT_URL: https://api.example.com/orders

volumes:
  pgdata:
