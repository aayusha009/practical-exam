version: 2

models:
  - name: stg_orders
    description: "Staged orders — one row per raw order, selected directly from the ecommerce.orders source with no renaming or business logic applied."
    columns:
      - name: order_id
        description: "Primary key of the orders source table."
        tests: [unique, not_null]
      - name: customer_id
        description: "Foreign key to stg_customers.customer_id."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: "The date the order was placed."
        tests: [not_null]
      - name: order_status
        description: "Current status of the order."
        tests:
          - accepted_values:
              values: ['pending', 'shipped', 'delivered', 'cancelled']
      - name: total_amount
        description: "Total value of the order, in the store's base currency."

  - name: stg_customers
    description: "Staged customers — one row per raw customer, selected directly from the ecommerce.customers source with no renaming or business logic applied."
    columns:
      - name: customer_id
        description: "Primary key of the customers source table."
        tests: [unique, not_null]
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."
      - name: email
        description: "Customer's email address."
      - name: country
        description: "Country the customer is based in."
